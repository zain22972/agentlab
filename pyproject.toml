[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maf-lab"
version = "0.1.0"
description = "MAF Agent Reliability Lab: statistically aware, MAF-native regression and adversarial reliability harness"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Mohammed Zain Hassan", email = "zain@example.com"}]

dependencies = [
    # CLI framework
    "click==8.1.7",
    # Validation and data models
    "pydantic==2.5.0",
    # YAML support
    "pyyaml==6.0.1",
    # Testing fixtures (will be re-exported for tests)
    "hypothesis==6.88.0",
]

[project.optional-dependencies]
dev = [
    # Test runner
    "pytest==7.4.3",
    "pytest-asyncio==0.23.1",
    # Linting and formatting
    "ruff==0.1.8",
    # Type checking
    "mypy==1.7.1",
    # Property testing
    "hypothesis==6.88.0",
]

[project.scripts]
maf-lab = "maf_lab.cli:main"

[tool.hatchling.build.targets.wheel]
packages = ["src/maf_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"
addopts = "-v --strict-markers"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "T20",  # flake8-print
]
ignore = [
    "E501",  # line-length (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["maf_lab"]
